<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarZone — Commander</title>
    <link rel="stylesheet" href="formulaire.css">
</head>

<body>
    <section>
        <a href="index.html" class="logo-site">Car<span>Zone</span></a>
        <h1>Commander votre véhicule</h1>
        <form id="form-commande">
            <div class="input-box">
                <div class="input">
                    <input type="text" placeholder="nom complet" required>
                </div>
                <div class="input">
                    <input type="tel" placeholder="numéro de téléphone" required>
                </div>
                <div class="input">
                    <input type="email" placeholder="adresse mail" required>
                </div>
            </div>
            <div class="option-box">
                <select name="article" id="article">
                    <option value="">BMW</option>
                    <option value="">AUDI</option>
                    <option value="">lamborghini</option>
                    <option value="">TOYOTA</option>
                    <option value="">Renault</option>
                    <option value="">Ford</option>
                </select>
            </div>
            <div class="btn-sub">
                <button type="submit">commander</button>
            </div>

            <div class="retour">
                <a href="index.html">retour à la page d'accueil</a>
            </div>
        </form>
        <p class="confirmation" id="confirmation" hidden>Votre commande a été effectuée avec succès. Nous vous contacterons très vite.</p>
    </section>
    <script>
        document.getElementById("form-commande").addEventListener("submit", (e) => {
            e.preventDefault();
            e.target.reset();
            document.getElementById("confirmation").hidden = false;
        });
    </script>
</body>

</html>
